<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light}:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Scheda forza + estetica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-title" content="Scheda forza">
<style>
/* Layout: one phone-width column. Sticky day tabs on top, exercise cards stacked below, rest timer docked at the bottom edge. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --sunk:#E3E8EE; --ink:#131922; --ink2:#465263; --muted:#6B7788; --line:#D3D9E1;
  --accent:#1D5BD0; --accent-ink:#FFFFFF; --accent-soft:#DCE7FB; --series:#1D5BD0;
  --ok:#157A43; --ok-soft:#DDF1E5; --bad:#B9322B; --bad-soft:#F8E1DF; --warn:#8F5400; --warn-soft:#F6E7CC;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1217; --surface:#171D25; --sunk:#212934; --ink:#EDF0F4; --ink2:#B4BDC9; --muted:#8B96A6; --line:#2B3440;
    --accent:#74A2FF; --accent-ink:#0A1220; --accent-soft:#1B2A47; --series:#5E90F5;
    --ok:#55C988; --ok-soft:#143424; --bad:#FF8177; --bad-soft:#44201D; --warn:#F2B552; --warn-soft:#3F2F12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#171D25; --sunk:#212934; --ink:#EDF0F4; --ink2:#B4BDC9; --muted:#8B96A6; --line:#2B3440;
  --accent:#74A2FF; --accent-ink:#0A1220; --accent-soft:#1B2A47; --series:#5E90F5;
  --ok:#55C988; --ok-soft:#143424; --bad:#FF8177; --bad-soft:#44201D; --warn:#F2B552; --warn-soft:#3F2F12;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 6px}
.brand{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;flex:none}
.sync{font-size:13px;line-height:1.2;color:var(--ink2);display:flex;align-items:center;gap:6px;min-width:0;text-align:right}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="saved"] i,.sync[data-s="local"] i{background:var(--ok)}
.sync[data-s="saving"] i,.sync[data-s="loading"] i{background:var(--warn)}
.sync[data-s="error"] i,.sync[data-s="stale"] i,.sync[data-s="ro"] i{background:var(--bad)}
.tabs{display:flex;gap:4px;padding-bottom:8px}
.tabs a{flex:1 1 0;min-width:0;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;text-decoration:none;color:var(--ink2);font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
.tabs a.wide{flex:1.7 1 0;font-size:16px}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}

main{padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
body.has-timer main{padding-bottom:140px}
.day-head h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.day-head p{color:var(--ink2);margin-top:2px}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:15px}
.notice.bad{background:var(--bad-soft)}

details{border-radius:var(--r)}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";font-family:var(--display);font-size:22px;width:16px;text-align:center;color:var(--accent);flex:none}
details[open]>summary::before{content:"\2212"}
.panel{background:var(--sunk);padding:2px 12px}
.panel .inner{padding:0 0 12px;display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--ink2)}
.panel ol,.panel ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

.card{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.c-head{display:flex;gap:10px;align-items:flex-start}
.tag{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;color:var(--muted);min-width:26px;flex:none;padding-top:1px}
.c-title{flex:1;min-width:0}
.c-title h3{font-size:17px;font-weight:600;line-height:1.25;text-wrap:balance}
.card.heavy .c-title h3{font-family:var(--display);font-weight:700;font-size:25px;text-transform:uppercase;letter-spacing:.01em;line-height:1.05}
.rx{color:var(--ink2);font-size:15px;margin-top:3px;font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--ink2);white-space:nowrap;flex:none}
.chip.hv{background:var(--accent);color:var(--accent-ink)}
.note{font-size:15px;color:var(--ink2)}
.sub{background:transparent}
.sub summary{font-weight:500;font-size:15px;min-height:36px;color:var(--ink2)}
.sub .inner{padding:0 0 4px 24px;font-size:15px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.ramp{display:grid;grid-template-columns:auto auto auto;gap:6px 16px;justify-content:start;align-items:center;font-variant-numeric:tabular-nums}
.ramp b{color:var(--ink);font-weight:600}
.ramp-go{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--ink);font:inherit}

.load{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step{width:48px;height:48px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-family:var(--display);font-size:28px;font-weight:600;line-height:1;flex:none}
.step:active{background:var(--accent-soft)}
.kg{width:92px;height:48px;border-radius:8px;border:1px solid var(--line);background:var(--bg);text-align:center;font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.unit{color:var(--ink2);font-size:15px}
.plates{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.goal{font-size:15px;color:var(--ink2)}
.goal b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.reps{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.reps label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.reps input{width:60px;height:48px;border-radius:8px;border:1px solid var(--line);background:var(--bg);text-align:center;font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.reps input::placeholder,.kg::placeholder{color:var(--muted);opacity:.4;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:46px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1 1 120px}
.btn.ghost{background:var(--sunk)}
.btn:disabled,.step:disabled{opacity:.45;cursor:default}
.last{font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.flat{background:var(--sunk);color:var(--ink2)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.donebox{background:var(--sunk);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.donebox .big{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.donebox p{font-size:15px;color:var(--ink2)}
.hist{display:flex;flex-direction:column;gap:4px;font-size:14px;font-variant-numeric:tabular-nums}
.hist div{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}

.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.block h3{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.02em}
.block p,.block li{font-size:15px;color:var(--ink2)}
.block ol,.block ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.block b{color:var(--ink);font-weight:600}
.wform{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.wform label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.wform input[type=date]{height:48px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:16px;min-width:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .lbl{font-size:13px;color:var(--muted)}
.stat .val{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .val small{font-family:var(--body);font-weight:500;font-size:14px;color:var(--ink2)}
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:5px 8px;font-size:13px;line-height:1.25;white-space:nowrap;font-variant-numeric:tabular-nums}
.tip b{font-weight:600;font-size:15px;display:block}
.rows{display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.rows .row{display:flex;align-items:center;gap:8px;min-height:40px;border-top:1px solid var(--line);font-size:15px}
.rows .row:first-child{border-top:0}
.rows .row span:first-child{flex:1;color:var(--ink2)}
.rows .row b{font-weight:600}
.x{width:40px;height:40px;border:0;background:transparent;color:var(--muted);font-size:20px;border-radius:8px}
.empty{color:var(--ink2);font-size:15px}
.notice a{color:inherit;font-weight:600}
.field{width:100%;min-width:0;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font:16px var(--body);letter-spacing:0;text-transform:none}
.field:disabled{opacity:.45}
textarea.field{height:auto;padding:10px;resize:vertical}
.efields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.efields label{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.efields .full{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;min-height:44px;font-size:15px;color:var(--ink2)}
.check input{width:22px;height:22px;margin:0;accent-color:var(--accent)}

.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.timer .bar{height:4px;background:var(--accent);width:100%;transform-origin:left center}
.timer .t-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.timer .lbl{flex:1;min-width:0;font-size:14px;opacity:.8;overflow-wrap:anywhere;line-height:1.2}
.timer .clock{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
.timer button{min-height:44px;padding:0 12px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;font-weight:600;font-size:15px;opacity:.9}
.timer.go{background:var(--ok);color:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:30;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:15px;max-width:calc(100% - 32px);text-align:center}
body.has-timer .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
@media (prefers-reduced-motion:no-preference){.timer .bar{transition:transform .25s linear}}
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">Scheda forza + estetica</div>

  </div>
</header>
<div class="wrap"><main id="view"></main></div>

</div>

    var msg='Prossima volta: almeno '+(base+1)+' ripetizioni in totale.';

    return {ok:ok,nextLoad:load,nextTgt:null,msg:msg};
  }
  if(ex.lo===ex.hi){
    if(min>=ex.lo)return {ok:true,nextLoad:up,nextTgt:ex.lo,msg:'Tutte le '+n+' × '+ex.lo+' chiuse. Prossima volta: '+(up!=null?fmtKg(up)+' kg.':'aumenta di '+fmtKg(step)+' kg.')};

    if(!by[m]){by[m]={mon:m,kg:0,t:0,n:0};keys.push(m)}by[m].kg+=e.kg;by[m].t+=t;by[m].n++});
  keys.sort(function(a,b){return a-b});

}
function trend(entries,nowT){
  var pts=entries.map(function(e){return {t:dnum(e.d),kg:e.kg}}).filter(function(p){return p.t>nowT-28&&p.t<=nowT});
  if(pts.length<4||pts[pts.length-1].t-pts[0].t<10)return null;

  var t=dnum(today()),mon=t-(new Date(t*864e5).getUTCDay()+6)%7,cur={},prev={},days=[];
  list.forEach(function(s){
    var sd=dnum(s.d),w=sd>=mon?cur:(sd>=mon-7?prev:null);
    if(!w)return;
    if(w===cur)days.unshift(s.day.toUpperCase());
    s.items.forEach(function(it){
      var ex=findEx(it.k,s.day),g=(ex&&ex.mg)||MG[it.k]||'Altro',r=w[g]||(w[g]={sets:0,kg:0}),reps=it.e.reps||[];
      r.sets+=reps.length;
      if(it.e.load>0)r.kg+=it.e.load*sum(reps);
    });
  });
  var rows=h('div',{class:'rows'});
  MUSCLE_GROUPS.forEach(function(g){
    if(!cur[g]&&!prev[g])return;
    var c=cur[g]||{sets:0,kg:0},p=prev[g]||{sets:0,kg:0},ds=c.sets-p.sets;
    var diff=(ds>0?'+':ds<0?'−':'±')+Math.abs(ds)+' serie'+(p.kg>0?' · '+(c.kg>=p.kg?'+':'−')+Math.abs(Math.round((c.kg-p.kg)/p.kg*100))+'%':'');
    add(rows,h('div',{class:'row'},h('span',null,g),h('b',null,c.sets+' serie'+(c.kg?' · '+fmtKg(Math.round(c.kg))+' kg':'')),h('span',{class:'pill flat',text:diff})));
  });
  return h('section',{class:'block'},h('h3',null,'Questa settimana'),
    h('p',null,'Sedute: '+days.length+' di 3'+(days.length?' ('+days.join(', ')+')':'')+'.'),
    rows.childNodes.length?[h('p',null,'Serie e volume (kg × ripetizioni) per gruppo muscolare da lunedì. Accanto, la differenza con tutta la settimana scorsa.'),rows]:h('p',{class:'empty',text:'Nessuna serie registrata in queste due settimane.'}));
}
function viewStorico(){
  var list=sessionsList();
  var out=[h('div',{class:'day-head'},h('h2',null,'Storico'),h('p',null,list.length?list.length+(list.length===1?' allenamento registrato':' allenamenti registrati'):'Nessun allenamento registrato'))];
  out.push(viewWeek(list));
  list.forEach(function(s){
    var D=DAYS[s.day],order=D?D.ex.map(function(x){return x.k}):[];
    s.items.sort(function(x,y){return order.indexOf(x.k)-order.indexOf(y.k)});
    var bw=S.body.entries.filter(function(b){return b.d===s.d})[0];
    var rows=h('div',{class:'hist'});
    s.items.forEach(function(it){
      var ex=findEx(it.k,s.day);
      add(rows,h('div',null,h('span',null,(ex?ex.n:it.k)+' · '+entryText(it.e)),pill(it.e.ok)));
    });
    out.push(h('section',{class:'block'},
      h('h3',null,fmtDate(s.d,true)+' · '+(D?D.name:s.day)),
      bw?h('p',null,'Peso corporeo: '+fmtKg(bw.kg)+' kg'):null,
      s.note?h('p',null,'Note: '+s.note):null,
      rows));
  });
  return out;
}

function viewBackup(){
  var file=h('input',{type:'file',accept:'application/json,.json',hidden:true,onchange:function(){
    var f=file.files[0];file.value='';if(!f)return;
    var reader=new FileReader();
    reader.onload=function(){
      var backup;try{backup=JSON.parse(reader.result)}catch(e){backup=null}
      var data=backup&&backup.app==='scheda-forza'&&backup.data,sd=data&&data['sf.data'];
      if(!sd||!sd.ex||typeof sd.ex!=='object'||!sd.body||!Array.isArray(sd.body.entries)){toast('File non valido: non è un backup di Scheda forza');return}
      if(!confirm('Importare il backup del '+backup.date+'? I dati attuali verranno sostituiti.'))return;
      Object.keys(data).forEach(function(k){if(k.slice(0,3)==='sf.')lsSet(k,data[k])});
      location.reload();
    };
    reader.readAsText(f);
  }});
  return h('section',{class:'block'},h('h3',null,'Backup dei dati'),
    h('p',null,'I dati sono salvati solo su questo telefono. Esporta un backup ogni tanto e conservalo su Drive o sul computer.'),
    h('div',{class:'actions'},
      h('button',{type:'button',class:'btn ghost',onclick:function(){
        var data={};
        for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.slice(0,3)==='sf.')data[k]=lsGet(k)}
        var json=JSON.stringify({app:'scheda-forza',v:1,date:today(),data:data}),name='scheda-forza-'+today()+'.json';
        if(window.SchedaForza){SchedaForza.exportData(json,name);return}
        var backupFile=new File([json],name,{type:'application/json'});
        if(navigator.canShare&&navigator.canShare({files:[backupFile]})){navigator.share({files:[backupFile]}).catch(function(){});return}
        var link=h('a',{href:URL.createObjectURL(backupFile),download:name});link.click();
      }},'Esporta'),
      h('button',{type:'button',class:'btn ghost',onclick:function(){file.click()}},'Importa'),
      file));
}

function goLocal(){mode='local';var d=lsGet('sf.data');if(d&&d.ex)S.ex=d.ex;if(d&&d.body&&Array.isArray(d.body.entries))S.body=d.body;
  if(!location.hash){var tp=todayPlan();history.replaceState(null,'','#'+(tp.current||tp.next))}
  render()}
if(location.protocol!=='file:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
(async function(){
  var cl=window.claude;
  if(!cl||typeof cl.use!=='function'){goLocal();return}
  try{db=await cl.use('db')}catch(e){db=null}
  if(!db){goLocal();return}
  mode='db';
  var slow=setTimeout(function(){if(!isReady()){stale=true;softRender()}},10000);
  function settle(){if(isReady()){clearTimeout(slow);stale=false}}
  function dead(e){clearTimeout(slow);if(e&&e.code==='revoked'){mode='ro'}else{stale=true}softRender()}
  db.collection('ex').onSnapshot(function(snap){
    var seen={};
    snap.docs.forEach(function(d){seen[d.id]=1;if(busy('ex:'+d.id))return;S.ex[d.id]=clone(d.data()||{})});
    for(var k in S.ex)if(!seen[k]&&!busy('ex:'+k))delete S.ex[k];
    if(!snap.metadata.fromCache){ready.ex=true;settle()}
    softRender();
  },dead);
  db.doc('body/log').onSnapshot(function(snap){
    if(!busy('body:log')){var d=snap.exists?snap.data():null;S.body={entries:(d&&Array.isArray(d.entries))?clone(d.entries):[]}}
    if(!snap.metadata.fromCache){ready.body=true;settle()}
    softRender();
  },dead);
  render();
})();
})();
